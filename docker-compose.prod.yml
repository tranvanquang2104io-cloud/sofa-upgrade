# docker-compose.prod.yml  —  Production
# Chạy: docker compose -f docker-compose.prod.yml up -d
#
# Stack: Nginx (port 80/443) → Gunicorn app → PostgreSQL
# SSL: mount certificate vào nginx hoặc dùng Certbot container riêng.

name: sofa-flow-prod

services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sofa_flow}
      POSTGRES_USER:     ${POSTGRES_USER:-sofa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    # Không expose port ra ngoài — chỉ app nội bộ được kết nối
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sofa_user}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    image: sofa-flow:${APP_VERSION:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV:    production
      FLASK_DEBUG:  "false"
      SECRET_KEY:   ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sofa_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sofa_flow}
    volumes:
      - uploads_prod:/app/app/uploads
    # Không expose port ra ngoài — Nginx proxy nội bộ

  nginx:
    image: nginx:1.25-alpine
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/static:ro          # static files phục vụ trực tiếp
      - uploads_prod:/app/uploads:ro          # uploads phục vụ trực tiếp
      # SSL certificates — uncomment khi có cert:
      # - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_prod_data:
  uploads_prod:
