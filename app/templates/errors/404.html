{% extends "base.html" %}

{% block title %}404 - Not Found - SofaFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body py-5">
                <i class="bi bi-search text-warning" style="font-size: 4rem;"></i>
                <h1 class="display-4 mt-3">404</h1>
                <h4 class="text-muted mb-3">Page Not Found</h4>
                <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                    <i class="bi bi-house"></i> Go to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
