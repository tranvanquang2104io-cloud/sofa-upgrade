{% extends "base.html" %}

{% block title %}403 - Forbidden - SofaFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body py-5">
                <i class="bi bi-shield-lock text-danger" style="font-size: 4rem;"></i>
                <h1 class="display-4 mt-3">403</h1>
                <h4 class="text-muted mb-3">Access Denied</h4>
                <p class="text-muted mb-4">You don't have permission to access this resource.</p>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                    <i class="bi bi-house"></i> Go to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
