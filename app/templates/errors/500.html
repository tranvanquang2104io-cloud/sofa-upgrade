{% extends "base.html" %}

{% block title %}500 - Server Error - SofaFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body py-5">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                <h1 class="display-4 mt-3">500</h1>
                <h4 class="text-muted mb-3">{{ t('Internal Server Error') }}</h4>
                <p class="text-muted mb-4">{{ t('Something went wrong on our end. Please try again later.') }}</p>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                    <i class="bi bi-house"></i> {{ t('Go to Dashboard') }}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
