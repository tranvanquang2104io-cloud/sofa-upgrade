{% extends "base.html" %}

{% block title %}Register - SofaFlow{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">{{ t('Register Company') }}</h2>
                    <p class="text-center text-muted mb-4">{{ t('Create a new SofaFlow account') }}</p>

                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label for="company_code" class="form-label">{{ t('Company Code') }}</label>
                            <input type="text" class="form-control" id="company_code" name="company_code" placeholder="e.g., SOFA-001" required>
                        </div>

                        <div class="mb-3">
                            <label for="company_name" class="form-label">{{ t('Company Name') }}</label>
                            <input type="text" class="form-control" id="company_name" name="company_name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">{{ t('Company Email') }}</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="full_name" class="form-label">{{ t('Your Full Name') }}</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" required>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">{{ t('Username') }}</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">{{ t('Password') }}</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">{{ t('Register') }}</button>
                    </form>

                    <hr>

                    <p class="text-center text-muted mb-0">
                        {{ t('Already have an account?') }} <a href="{{ url_for('auth.login') }}">{{ t('Login here') }}</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
