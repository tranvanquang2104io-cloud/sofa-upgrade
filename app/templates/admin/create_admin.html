{% extends "admin/base.html" %}
{% block title %}Add Master Admin{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
    <a href="{{ url_for('admin.list_admins') }}" class="btn btn-outline-secondary me-3" title="{{ t('Back') }}" aria-label="{{ t('Back') }}"><i class="bi bi-arrow-left"></i></a>
    <h2 class="mb-0"><i class="bi bi-person-plus me-2"></i>Add Master Admin</h2>
</div>
<div class="row">
    <div class="col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.create_admin') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="f_username">Username <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" required id="f_username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="f_full_name">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control" required id="f_full_name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="f_email">Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" required id="f_email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="f_password">Password <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" required minlength="6" id="f_password">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>Create
                        </button>
                        <a href="{{ url_for('admin.list_admins') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
