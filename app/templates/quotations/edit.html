{% extends "base.html" %}

{% block title %}Edit Quotation - SofaFlow{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-8">
        <h1>
            <i class="bi bi-pencil-square"></i> Edit Quotation
        </h1>
        <p class="text-muted">{{ quotation.quotation_number }} - {{ order.order_code }}</p>
    </div>
    <div class="col-md-4 text-end">
        <a href="{{ url_for('dashboard.view_quotation', quotation_id=quotation.id) }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="quotation_date" class="form-label">Quotation Date</label>
                            <input type="date" class="form-control" id="quotation_date" name="quotation_date" 
                                   value="{{ quotation.quotation_date.strftime('%Y-%m-%d') }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="validity_days" class="form-label">Validity (Days)</label>
                            <input type="number" class="form-control" id="validity_days" name="validity_days" 
                                   value="{{ quotation.validity_days }}" min="1" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Line Items</label>
                        <div id="items-container">
                            {% for item in quotation.items %}
                            <div class="row mb-2 item-row">
                                <div class="col-md-5">
                                    <input type="text" class="form-control" name="item_name[]" 
                                           placeholder="Item name" value="{{ item.name }}" required>
                                </div>
                                <div class="col-md-2">
                                    <input type="number" class="form-control item-qty" name="item_quantity[]" 
                                           placeholder="Qty" value="{{ item.quantity }}" step="0.01" required>
                                </div>
                                <div class="col-md-3">
                                    <input type="number" class="form-control item-price" name="item_price[]" 
                                           placeholder="Unit Price" value="{{ item.unit_price }}" step="0.01" required>
                                </div>
                                <div class="col-md-2">
                                    <button type="button" class="btn btn-sm btn-outline-danger remove-item">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="add-item">
                            <i class="bi bi-plus"></i> Add Item
                        </button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Total Amount</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="total-amount" 
                                   value="{{ quotation.total_amount }}" step="0.01" readonly>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3">{{ quotation.notes or '' }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Save Changes
                        </button>
                        <a href="{{ url_for('dashboard.view_quotation', quotation_id=quotation.id) }}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const addItemBtn = document.getElementById('add-item');
    const itemsContainer = document.getElementById('items-container');
    const totalAmountInput = document.getElementById('total-amount');

    function updateTotal() {
        let total = 0;
        const rows = document.querySelectorAll('.item-row');
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const price = parseFloat(row.querySelector('.item-price').value) || 0;
            total += qty * price;
        });
        totalAmountInput.value = total.toFixed(2);
    }

    function addItemRow() {
        const row = document.createElement('div');
        row.className = 'row mb-2 item-row';
        row.innerHTML = `
            <div class="col-md-5">
                <input type="text" class="form-control" name="item_name[]" placeholder="Item name" required>
            </div>
            <div class="col-md-2">
                <input type="number" class="form-control item-qty" name="item_quantity[]" placeholder="Qty" step="0.01" required>
            </div>
            <div class="col-md-3">
                <input type="number" class="form-control item-price" name="item_price[]" placeholder="Unit Price" step="0.01" required>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-sm btn-outline-danger remove-item">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        `;
        itemsContainer.appendChild(row);
        attachEventListeners(row);
    }

    function attachEventListeners(row) {
        row.querySelector('.remove-item').addEventListener('click', function(e) {
            e.preventDefault();
            row.remove();
            updateTotal();
        });

        row.querySelectorAll('.item-qty, .item-price').forEach(input => {
            input.addEventListener('change', updateTotal);
            input.addEventListener('input', updateTotal);
        });
    }

    // Attach listeners to existing rows
    document.querySelectorAll('.item-row').forEach(row => {
        attachEventListeners(row);
    });

    // Add new item button
    addItemBtn.addEventListener('click', addItemRow);

    // Initial total calculation
    updateTotal();
});
</script>
{% endblock %}
